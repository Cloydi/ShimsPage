<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Game · For Shim</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="game-style.css">
  <link rel="icon" href="../logo.png">
  <style>
    /* Site-themed "Return" link, layered above the puzzle's own menu (top z-index: 10) */
    .site-back-btn {
      position: fixed;
      top: 14px;
      right: 18px;
      z-index: 999;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(217, 79, 135, 0.25);
      text-decoration: none;
      font-family: 'Lato', sans-serif;
      font-size: 0.62rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: rgba(42, 14, 30, 0.6);
      transition: color 0.3s, border-color 0.3s, transform 0.2s;
    }
    .site-back-btn:hover {
      color: #d94f87;
      border-color: #d94f87;
      transform: translateY(-1px);
    }
    .site-back-btn svg {
      width: 13px; height: 13px;
      stroke: currentColor; fill: none; stroke-width: 2;
    }
  </style>
</head>
<body>

<a class="site-back-btn" href="../mainMenu/mainMenu.html">
  <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  Return
</a>

<div id=forPuzzle></div>
<div id="menu">
    <p id="controls">close controls</p>
    <div id="showhide">
        <hr>
        <p class="center"><button type="button" id="help">instructions</button></p>
        <hr>
        <p class="center">
            <button type="button" id="default">default image</button>
            <button type="button" id="load">load image</button>
        </p>
        <p class="center"><button type="button" id="show">show image</button></p>
        <p><input type=checkbox id="enablerot"><label for="enablerot" id="enablerotlabel">enable rotation</label>
        </p>
        <p>shape: <select id="shape">
                <option value="1" selected>classic</option>
                <option value="2">triangle</option>
                <option value="3">round</option>
                <option value="4">straight</option>
            </select></p>
        <p>number of pieces: <select id="nbpieces">
                <option selected>12</option>
                <option>25</option>
                <option>50</option>
                <option>100</option>
                <option>200</option>
                <option>500</option>
                <option>1000</option>
            </select></p>
        <p>between connected pieces: <select id="drawmode">
                <option value="1" selected>thin line</option>
                <option value="2">flat</option>
                <option value="3">bevel</option>
            </select></p>
        <p class="center"><button type="button" id="start">start game</button><button type="button" id="stop">stop
                game</button></p>
        <hr>
        <p>storage: <button type="button" id="helpstorage">?</button></p>
        <p class="center"><button type="button" id="save">save game</button><button type="button"
                id="restore">restore game</button></p>
        <hr>
        <p>file: <button type="button" id="helpfile">?</button></p>
        <p class="center"><button type="button" id="fsave">save game</button><button type="button"
                id="frestore">restore game</button></p>
        <p>save name: <input type="text" id="saveas"><span id="saveext"></span></p>
    </div> <!-- showhide -->
</div> <!-- menu -->

<script src="game-script.js"></script>
<script src="../assets/js/persistent-audio.js"></script>

</body>
</html>
